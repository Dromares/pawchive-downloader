<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Pawchive Downloader</title>
  <desc>A paw print whose main pad carries a download arrow, on a dark rounded tile. Tokens: bg #15181E, surface #1C2028, accent #6AA3FF (DAN-1542 dark palette).</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262D3A"/>
      <stop offset="1" stop-color="#15181E"/>
    </linearGradient>
    <linearGradient id="paw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8DBAFF"/>
      <stop offset="1" stop-color="#6AA3FF"/>
    </linearGradient>
  </defs>
  <!-- tile: 16u margin so the rim survives rasterising; rim lifts the tile off dark panels -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)" stroke="#6F788D" stroke-width="8"/>
  <g fill="url(#paw)">
    <!-- toes -->
    <ellipse cx="104" cy="254" rx="44" ry="62" transform="rotate(-24 104 254)"/>
    <ellipse cx="408" cy="254" rx="44" ry="62" transform="rotate(24 408 254)"/>
    <ellipse cx="203" cy="165" rx="47" ry="66" transform="rotate(-8 203 165)"/>
    <ellipse cx="309" cy="165" rx="47" ry="66" transform="rotate(8 309 165)"/>
    <!-- main pad -->
    <path d="M256 242 C 318 242 372 296 394 352 C 410 394 384 436 336 436 C 306 436 284 424 256 424 C 228 424 206 436 176 436 C 128 436 102 394 118 352 C 140 296 194 242 256 242 Z"/>
  </g>
  <!-- download arrow, cut out of the pad in tile colour -->
  <path d="M256 300 V 372 M 222 342 L 256 376 L 290 342" fill="none" stroke="#1C2028" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
