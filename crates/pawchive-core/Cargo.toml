[package]
name = "pawchive-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }

[target.'cfg(target_os = "android")'.dependencies]
# Android's JVM trust store is unreachable from a NativeActivity app (rustls-platform-verifier
# needs a Gradle-bundled Kotlin helper + JNI init that our no-Java APK can't provide).
# Use Mozilla's bundled roots instead: same roots every browser ships, zero JNI.
rustls = "0.23"
webpki-roots = "0.26"
