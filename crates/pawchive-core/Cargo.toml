[package]
name = "pawchive-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
